services:
  _defaults:
    autowire: true

  oxid_esales.oxid_eshop_update_component.command.migrate_config_command:
    class: OxidEsales\OxidEshopUpdateComponent\Command\MigrateConfigCommand
    tags:
      - { name: 'console.command', command: 'oe:update:migrate-config' }

  oxid_esales.oxid_eshop_update_component.command.refactor_module_command:
    class: OxidEsales\OxidEshopUpdateComponent\Command\RefactorModuleCommand
    tags:
      - { name: 'console.command', command: 'oe:update:refactor-module' }

  oxid_esales.oxid_eshop_update_component.command.update_module_command:
    class: OxidEsales\OxidEshopUpdateComponent\Command\UpdateModuleCommand
    tags:
      - { name: 'console.command', command: 'oe:update:update-module' }

  oxid_esales.oxid_eshop_update_component.command.update_template_command:
    class: OxidEsales\OxidEshopUpdateComponent\Command\TemplateUpdateCommand
    tags:
      - { name: 'console.command', command: 'oe:update:update-templates' }

  OxidEsales\OxidEshopUpdateComponent\Config\ConfigurationPathProvider:
    class: OxidEsales\OxidEshopUpdateComponent\Config\ConfigurationPathProvider

  OxidEsales\OxidEshopUpdateComponent\Config\Migration\ConfigurationMigratorInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Config\Migration\ConfigurationMigrator

  OxidEsales\OxidEshopUpdateComponent\Config\Reader\ConfigurationReaderInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Config\Reader\ConfigurationReader

  OxidEsales\OxidEshopUpdateComponent\Config\Writer\ConfigurationWriterInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Config\Writer\ConfigurationWriter

  OxidEsales\OxidEshopUpdateComponent\Config\Transformer\ConfigurationTransformerInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Config\Transformer\ConfigurationTransformer

  OxidEsales\OxidEshopUpdateComponent\Config\Validator\ConfigurationValidatorInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Config\Validator\ConfigurationValidator

  OxidEsales\OxidEshopUpdateComponent\Module\Update\ModuleUpdaterInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Module\Update\ModuleUpdater

  OxidEsales\OxidEshopUpdateComponent\Module\Validator\ModuleValidatorInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Module\Validator\ModuleValidator

  OxidEsales\OxidEshopUpdateComponent\Module\Process\ProcessRunnerInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Module\Process\ProcessRunner

  OxidEsales\OxidEshopUpdateComponent\Module\Factory\RectorConfigFactoryInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Module\Factory\RectorConfigFactory

  OxidEsales\OxidEshopUpdateComponent\Template\Migration\TemplateFilterMigratorInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Template\Migration\TemplateFilterMigrator

  OxidEsales\OxidEshopUpdateComponent\Template\FileReader\FileReader:

  OxidEsales\OxidEshopUpdateComponent\Template\Transformer\TwigFilterTransformerInterface:
    class: OxidEsales\OxidEshopUpdateComponent\Template\Transformer\TwigDateFilterTransformer
